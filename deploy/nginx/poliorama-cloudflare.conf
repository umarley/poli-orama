# Reverse proxy para aplicacao executada integralmente pelo PM2 e publicada
# exclusivamente por Cloudflare Tunnel.
#
# Substitua todas as ocorrencias de "seudominio.com.br" pelo dominio real.
#
# Configure os hostnames do tunnel apontando para o Nginx:
#
#   http://127.0.0.1:8080
#
# Fluxo:
#   seudominio.com.br       -> Nginx -> Astro/Fronend publico :4321
#   www.seudominio.com.br   -> Nginx -> Astro/Fronend publico :4321
#   app.seudominio.com.br   -> Nginx -> React/Vite            :5173
#   api.seudominio.com.br   -> Nginx -> FastAPI                :8000
#
# O Nginx escuta somente no loopback e não deve ser exposto diretamente à
# internet. TLS, redirecionamento HTTPS, HSTS e certificados ficam no Cloudflare.
#
# Ative este arquivo OU poliorama.conf, nunca os dois simultaneamente.

upstream poliorama_site {
    server 127.0.0.1:4321;
    keepalive 16;
}

upstream poliorama_frontend {
    server 127.0.0.1:5173;
    keepalive 16;
}

upstream poliorama_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Mantem WebSocket/Upgrade para os servidores Vite e Astro.
map $http_upgrade $poliorama_connection_upgrade {
    default upgrade;
    ""      close;
}

# O tunnel informa o protocolo usado pelo visitante. Caso o header não seja
# enviado, considera HTTPS, pois a conexão pública termina no Cloudflare.
map $http_x_forwarded_proto $poliorama_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# Rejeita hostnames que não tenham sido declarados no tunnel.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Site público Astro, executado pelo PM2 na porta 4321.
server {
    listen 80;
    server_name poliorama.com.br www.poliorama.com.br;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/log/nginx/poliorama-site.access.log;
    error_log /var/log/nginx/poliorama-site.error.log;

    # Chamadas same-origin do site são enviadas diretamente ao FastAPI.
    location /api/ {
        proxy_pass http://poliorama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $poliorama_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://poliorama_site;
        proxy_http_version 1.1;

        # Evita bloqueio do servidor de desenvolvimento por allowedHosts.
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $poliorama_forwarded_proto;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $poliorama_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }
}

# Aplicação autenticada React/Vite, executada pelo PM2 na porta 5173.
server {
    listen 80;
    server_name app.poliorama.com.br;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/log/nginx/poliorama-app.access.log;
    error_log /var/log/nginx/poliorama-app.error.log;

    # Chamadas same-origin da SPA são enviadas diretamente ao FastAPI.
    location /api/ {
        proxy_pass http://poliorama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $poliorama_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://poliorama_frontend;
        proxy_http_version 1.1;

        # O Vite atual aceita localhost; o hostname público segue em
        # X-Forwarded-Host para rastreabilidade.
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $poliorama_forwarded_proto;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $poliorama_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }
}

# FastAPI, executado pelo PM2 na porta 8000.
server {
    listen 80;
    server_name api.poliorama.com.br;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/poliorama-api.access.log;
    error_log /var/log/nginx/poliorama-api.error.log;

    location / {
        proxy_pass http://poliorama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $poliorama_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }
}
