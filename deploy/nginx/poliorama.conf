# Substitua todas as ocorrencias de "seudominio.com.br" pelo dominio real.
# O certificado abaixo deve cobrir:
#   seudominio.com.br, www.seudominio.com.br,
#   app.seudominio.com.br e api.seudominio.com.br.

upstream poliorama_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirecionamento global para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name
        seudominio.com.br
        www.seudominio.com.br
        app.seudominio.com.br
        api.seudominio.com.br;

    return 301 https://$host$request_uri;
}

# Site publico.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br www.seudominio.com.br;

    root /var/www/poliorama/current/site_publico/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PolioramaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/log/nginx/poliorama-site.access.log;
    error_log /var/log/nginx/poliorama-site.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }

    # Permite que o site consuma a API pela mesma origem.
    location /api/ {
        proxy_pass http://poliorama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Aplicacao autenticada React.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.seudominio.com.br;

    root /var/www/poliorama/current/frontend_core/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PolioramaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    access_log /var/log/nginx/poliorama-app.access.log;
    error_log /var/log/nginx/poliorama-app.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Mantem as chamadas da SPA na mesma origem.
    location /api/ {
        proxy_pass http://poliorama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }

    location = /index.html {
        expires -1;
    }

    # Fallback necessario para as rotas do React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Acesso direto a API, integracoes, health check e OpenAPI.
