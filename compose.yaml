name: vurix-eleitoral

services:
  api:
    build:
      context: ./backend_core
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+asyncpg://app_inteligencia:troque_esta_senha@postgres:5432/inteligencia_politica}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4321,http://127.0.0.1:4321}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-before-production}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-local-compose-mfa-key-change-before-production}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_core
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  site:
    build:
      context: ./site_publico
    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4321}
      PUBLIC_APP_LOGIN_URL: ${PUBLIC_APP_LOGIN_URL:-http://localhost:5173/login}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend_jobs_celery
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      JOBS_DATABASE_URL: ${JOBS_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/inteligencia_politica}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      COMPLETENESS_JOB_ENABLED: ${COMPLETENESS_JOB_ENABLED:-true}
      COMPLETENESS_JOB_HOUR: ${COMPLETENESS_JOB_HOUR:-2}
      COMPLETENESS_JOB_MINUTE: ${COMPLETENESS_JOB_MINUTE:-30}
      COMPLETENESS_JOB_BATCH_SIZE: ${COMPLETENESS_JOB_BATCH_SIZE:-1000}
      DEMAND_DEADLINES_ENABLED: ${DEMAND_DEADLINES_ENABLED:-true}
      DEMAND_DEADLINES_HOUR: ${DEMAND_DEADLINES_HOUR:-7}
      DEMAND_DEADLINES_LEAD_DAYS: ${DEMAND_DEADLINES_LEAD_DAYS:-3}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A jobs.celery_app inspect ping -d celery@$${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker-beat:
    build:
      context: ./backend_jobs_celery
    command:
      [
        "celery",
        "-A",
        "jobs.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      JOBS_DATABASE_URL: ${JOBS_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/inteligencia_politica}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      COMPLETENESS_JOB_ENABLED: ${COMPLETENESS_JOB_ENABLED:-true}
      COMPLETENESS_JOB_HOUR: ${COMPLETENESS_JOB_HOUR:-2}
      COMPLETENESS_JOB_MINUTE: ${COMPLETENESS_JOB_MINUTE:-30}
      COMPLETENESS_JOB_BATCH_SIZE: ${COMPLETENESS_JOB_BATCH_SIZE:-1000}
      DEMAND_DEADLINES_ENABLED: ${DEMAND_DEADLINES_ENABLED:-true}
      DEMAND_DEADLINES_HOUR: ${DEMAND_DEADLINES_HOUR:-7}
      DEMAND_DEADLINES_LEAD_DAYS: ${DEMAND_DEADLINES_LEAD_DAYS:-3}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.5
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inteligencia_politica}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "./database/migrations/001 - ddl_inteligencia_politica.sql:/docker-entrypoint-initdb.d/001-ddl.sql:ro"
      - "./database/migrations/002 - tenants_planos_onboarding.sql:/docker-entrypoint-initdb.d/002-tenants.sql:ro"
      - "./database/migrations/003 - auth_rbac_auditoria_p0.sql:/docker-entrypoint-initdb.d/003-auth.sql:ro"
      - "./database/migrations/004 - auth_p1_acesso_territorial.sql:/docker-entrypoint-initdb.d/004-auth-p1.sql:ro"
      - "./database/migrations/005 - auth_p2_mfa_sessoes.sql:/docker-entrypoint-initdb.d/005-auth-p2.sql:ro"
      - "./database/migrations/006 - cadastro_pessoas_constraints.sql:/docker-entrypoint-initdb.d/006-cadastro.sql:ro"
      - "./database/migrations/007 - cadastro_merge_assistido.sql:/docker-entrypoint-initdb.d/007-cadastro-merge.sql:ro"
      - "./database/migrations/008 - territorios_georreferenciamento.sql:/docker-entrypoint-initdb.d/008-territorios.sql:ro"
      - "./database/migrations/009 - metas_votos_rankings_alertas.sql:/docker-entrypoint-initdb.d/009-metas.sql:ro"
      - "./database/migrations/010 - importacao_etl_qualidade_dados.sql:/docker-entrypoint-initdb.d/010-etl.sql:ro"
      - "./database/migrations/011 - agenda_eventos.sql:/docker-entrypoint-initdb.d/011-agenda.sql:ro"
      - "./database/migrations/012 - demandas_atendimentos.sql:/docker-entrypoint-initdb.d/012-demandas.sql:ro"
      - "./database/migrations/016 - demandas_indices_alertas.sql:/docker-entrypoint-initdb.d/016-demandas-alertas.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
